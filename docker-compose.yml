services:
  keneya:
    # Image PHP-FPM pré-construite : toutes les extensions (pdo_mysql, redis,
    # gd, intl, bcmath…) sont déjà incluses. Aucune compilation → aucun build
    # lourd → impossible de figer la machine.
    image: serversideup/php:8.4-fpm
    container_name: ${APP_NAME:-keneya}_keneya
    restart: unless-stopped
    env_file:
      - .env.docker
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      # Aligne l'utilisateur du conteneur sur ton compte hôte (écriture storage/)
      - PUID=1000
      - PGID=1000
    networks:
      - keneya
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME:-keneya}_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - keneya
    depends_on:
      - keneya

  mysql:
    image: mysql:8.4
    container_name: ${APP_NAME:-keneya}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-keneya}
      MYSQL_USER: ${DB_USERNAME:-keneya}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - keneya_mysql:/var/lib/mysql
    networks:
      - keneya

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-keneya}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - keneya_redis:/data
    networks:
      - keneya
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${APP_NAME:-keneya}_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - keneya

volumes:
  keneya_mysql:
  keneya_redis:

networks:
  keneya:
    driver: bridge
