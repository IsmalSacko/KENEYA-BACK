; Performance
; NB: dev config. validate_timestamps=1 makes OPcache re-check files on each
; request so code edits take effect without a php-fpm restart. In production
; set validate_timestamps=0 (freeze bytecode) and reset OPcache on deploy.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=1

; Limits
memory_limit=512M
upload_max_filesize=50M
post_max_size=50M
max_execution_time=120

; Error handling (dev)
display_errors=On
display_startup_errors=On
error_reporting=E_ALL

; Timezone
date.timezone=Africa/Bamako
